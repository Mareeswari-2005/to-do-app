<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To do planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="outline">
  <div class="div1">
    <div class="header1"><center><h1>To do</h1></center></div>
  
    <div class="task-box">
     
      <div class="task-adder">
         <p>Add your task</p>
         <input class="task" placeholder="task.....">
         <button id="add">ADD</button>
      </div>
    </div>
  </div>

  <div class="div2">
    <div class="header2"><center><h1>Task Added</h1></center></div>

  
    <div class="checklist">
      <p class="task-list"></p>
   </div>
  </div>

  <div class="div3">
    <div class="header3"><center><h1>Completed tasks</h1></center></div>
  
  
    <div class="completed-task">
      <p class="task-com"></p>
    </div>
    
  </div>
</div>
  
</body>
<script src="script.js"></script>
</html>
